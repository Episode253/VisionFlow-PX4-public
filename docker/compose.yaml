services:
  px4-humble-gz:
    build:
      context: ..
      dockerfile: docker/Dockerfile.humble-gz
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: visionflow-px4:humble-gz
    container_name: visionflow-px4-humble-gz

    working_dir: /workspace/VisionFlow-PX4

    volumes:
      - ..:/workspace/VisionFlow-PX4:rw
      - ./cache/ccache:/home/px4/.ccache:rw
      - ./cache/gz:/home/px4/.gz:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/dri:/dev/dri

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=0
      - CCACHE_DIR=/home/px4/.ccache
      - ROS_DISTRO=humble
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all

    network_mode: host
    privileged: true
    stdin_open: true
    tty: true

    gpus: all

    command: bash
