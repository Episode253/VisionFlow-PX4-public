#!/usr/bin/env bash

DEFAULT_PROFILE="${DEFAULT_PROFILE:-Entity 1}"
DEFAULT_EXTRA_CMAKE_ARGS="${DEFAULT_EXTRA_CMAKE_ARGS:--DENABLE_LOCKSTEP_SCHEDULER=ON}"

SITL_PROFILES=()

add_sitl_profile() {
    local id=""
    local name=""
    local world=""
    local target=""
    local extra="${DEFAULT_EXTRA_CMAKE_ARGS}"
    local pose=""

    while [[ $# -gt 0 ]]; do
        case "$1" in
            --id)
                id="${2:?missing value for --id}"
                shift 2
                ;;
            --name)
                name="${2:?missing value for --name}"
                shift 2
                ;;
            --world)
                world="${2:?missing value for --world}"
                shift 2
                ;;
            --target)
                target="${2:?missing value for --target}"
                shift 2
                ;;
            --extra)
                extra="${2:-}"
                shift 2
                ;;
            --pose)
                pose="${2:-}"
                shift 2
                ;;
            *)
                echo "[error] Unknown add_sitl_profile option: $1" >&2
                return 1
                ;;
        esac
    done

    if [[ -z "${id}" || -z "${name}" || -z "${world}" || -z "${target}" ]]; then
        echo "[error] Invalid SITL profile. Required: --id --name --world --target" >&2
        echo "        id='${id}' name='${name}' world='${world}' target='${target}'" >&2
        return 1
    fi

    if [[ "${id}${name}${world}${target}${extra}${pose}" == *"|"* ]]; then
        echo "[error] SITL profile fields must not contain '|': ${id}" >&2
        return 1
    fi

    if [[ -n "${pose}" ]]; then
        IFS=',' read -r -a pose_parts <<< "${pose}"
        if [[ "${#pose_parts[@]}" -ne 6 ]]; then
            echo "[error] Invalid pose for SITL profile '${id}': expected x,y,z,roll,pitch,yaw" >&2
            return 1
        fi

        for pose_part in "${pose_parts[@]}"; do
            if [[ ! "${pose_part}" =~ ^[-+]?[0-9]+([.][0-9]*)?([eE][-+]?[0-9]+)?$ &&
                  ! "${pose_part}" =~ ^[-+]?([.][0-9]+)([eE][-+]?[0-9]+)?$ ]]; then
                echo "[error] Invalid pose for SITL profile '${id}': ${pose}" >&2
                return 1
            fi
        done
    fi

    SITL_PROFILES+=("${id}|${name}|${world}|${target}|${extra}|${pose}")
}

add_sitl_profile \
    --id "Entity 1" \
    --name "PreGME(季梦玉)模型（laboratory_landingbox）" \
    --world "laboratory_landingbox" \
    --target "gz_q940_ti_gripper4_laboratory_landingbox"

