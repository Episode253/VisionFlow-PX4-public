<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <circle cx="16" cy="16" r="15" fill="#303f9f"/>
  <!-- Quadcopter + manipulator -->
  <g transform="translate(16, 14)" stroke="#ffffff" fill="#ffffff">
    <!-- X frame arms -->
    <g stroke-width="2.4" stroke-linecap="round">
      <line x1="0" y1="0" x2="-8.5" y2="-5"/>
      <line x1="0" y1="0" x2="8.5" y2="-5"/>
      <line x1="0" y1="0" x2="-8.5" y2="5"/>
      <line x1="0" y1="0" x2="8.5" y2="5"/>
    </g>
    <!-- Motor hubs -->
    <circle cx="-8.5" cy="-5" r="2.2" stroke="none"/>
    <circle cx="8.5"  cy="-5" r="2.2" stroke="none"/>
    <circle cx="-8.5" cy="5"  r="2.2" stroke="none"/>
    <circle cx="8.5"  cy="5"  r="2.2" stroke="none"/>
    <!-- Body + lens -->
    <rect x="-4.5" y="-4" width="9" height="8" rx="2" stroke="none"/>
    <circle cx="0" cy="0" r="2.4" fill="#ffab00" stroke="none"/>
    <!-- Manipulator arm + gripper -->
    <g stroke-width="1.8" stroke-linecap="round" fill="none">
      <line x1="0" y1="4" x2="0" y2="9"/>
      <path d="M0,9 q4,1 3,5"/>
      <path d="M0,9 q-4,1 -3,5"/>
    </g>
  </g>
</svg>
