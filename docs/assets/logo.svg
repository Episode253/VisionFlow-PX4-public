<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="rocket-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#536dfe"/>
      <stop offset="100%" stop-color="#303f9f"/>
    </linearGradient>
    <linearGradient id="flame-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6d00"/>
      <stop offset="100%" stop-color="#ffab00"/>
    </linearGradient>
  </defs>

  <!-- Outer ring / hexagon -->
  <circle cx="250" cy="240" r="200" stroke="url(#rocket-grad)" stroke-width="8" fill="none" opacity="0.3"/>

  <!-- Rocket body -->
  <g transform="translate(250, 240)">
    <!-- Rocket fuselage -->
    <path d="M-20,-40 L0,-80 L20,-40 L15,40 L-15,40 Z"
          fill="url(#rocket-grad)" stroke="#303f9f" stroke-width="2"/>

    <!-- Rocket nose cone -->
    <path d="M-20,-40 L0,-80 L20,-40 Z" fill="#5c6bc0"/>

    <!-- Left fin -->
    <path d="M-20,-10 L-55,35 L-15,30 Z" fill="url(#rocket-grad)" stroke="#303f9f" stroke-width="2"/>

    <!-- Right fin -->
    <path d="M20,-10 L55,35 L15,30 Z" fill="url(#rocket-grad)" stroke="#303f9f" stroke-width="2"/>

    <!-- Window -->
    <circle cx="0" cy="-15" r="8" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="-15" r="5" fill="#303f9f"/>

    <!-- Flame -->
    <path d="M-10,40 Q-5,55 0,90 Q5,55 10,40 Z"
          fill="url(#flame-grad)" opacity="0.9"/>
    <path d="M-5,40 Q-2,50 0,75 Q2,50 5,40 Z"
          fill="#ffab00" opacity="0.7"/>
  </g>

  <!-- Text: VisionFlow -->
  <text x="250" y="420" text-anchor="middle"
        font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="52" font-weight="800" fill="#1a1a2e"
        letter-spacing="2">
    VISION<tspan fill="#536dfe">FLOW</tspan>
  </text>

  <!-- Text: PX4 -->
  <text x="250" y="465" text-anchor="middle"
        font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="28" font-weight="500" fill="#666666"
        letter-spacing="6">
    PX4
  </text>
</svg>
