
{% include 'header.html' %}

<style>
.upload-container {
    max-width: 600px;
    margin: 40px auto;
}

.upload-container h3 {
    color: #06465c;
    font-family: 'Play', sans-serif;
    font-size: 24px;
    font-weight: 400;
    margin-bottom: 30px;
    text-transform: uppercase;
    text-align: center;
}

.upload-zone {
    position: relative;
    display: block;
    width: 100%;
    border: 2px dashed #ccc;
    border-radius: 8px;
    padding: 30px 20px;
    text-align: center;
    transition: all 0.3s ease;
    background: #fafafa;
    margin-bottom: 20px;
    cursor: pointer;
    box-sizing: border-box;
}

.upload-zone:hover {
    border-color: #008cba;
    background: #f0f8ff;
}

.upload-zone.has-file {
    border-color: #43ac6a;
    background: #f0fff4;
}

.upload-zone input[type="file"] {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
    margin: 0;
    padding: 0;
}

.upload-zone .zone-content {
    position: relative;
    z-index: 1;
    pointer-events: none;
}

.upload-zone .label-text {
    font-size: 16px;
    color: #666;
    margin-bottom: 8px;
}

.upload-zone .file-name {
    font-size: 14px;
    color: #06465c;
    font-weight: 500;
    word-break: break-all;
}

.upload-btn {
    display: block;
    width: 100%;
    padding: 14px 20px;
    background: #008cba;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    box-sizing: border-box;
}

.upload-btn:hover:not(:disabled) {
    background: #006d94;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(0,140,186,0.3);
}

.upload-btn:disabled {
    background: #ccc;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}

.progress-container {
    margin-top: 20px;
    display: none;
}

.progress {
    height: 8px;
    border-radius: 4px;
    background: #eee;
}

.progress-bar {
    background: #008cba;
    border-radius: 4px;
    transition: width 0.3s ease;
}

.error-msg {
    margin-top: 16px;
    padding: 12px 16px;
    background: #fff3f3;
    border: 1px solid #f04124;
    border-radius: 6px;
    color: #f04124;
    display: none;
    text-align: center;
}
</style>

<div class="upload-container">
    <h3>Upload Log File</h3>

    <form id="upload-form" enctype="multipart/form-data">
        <label for="file" class="upload-zone" id="upload-zone">
            <input type="file" name="filearg" id="file" accept=".ulg" style="display: none;">
            <div class="zone-content">
                <div class="label-text">Click to select a .ulg log file</div>
                <div class="file-name" id="file-name"></div>
            </div>
        </label>

        <button class="upload-btn" id="upload-button" type="button">
            Upload
        </button>

        <div class="progress-container" id="progress-container">
            <div class="progress">
                <div class="progress-bar" id="progress-bar" role="progressbar" style="width: 0%;">0%</div>
            </div>
        </div>

        <div class="error-msg" id="upload-failure">
            File upload failed. Please try again.
        </div>
    </form>
</div>

{% include 'footer.html' %}

<script type="text/javascript" src="plot_app/static/js/upload.js?v=8"></script>

</body>
</html>
