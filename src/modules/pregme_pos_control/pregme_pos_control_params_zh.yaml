module_name: pregme_pos_control
parameters:
- group: Pregme Position Control
  definitions:
    PREGME_LPX:
      description:
        short: X 轴位置 lambda 增益
        long: X 轴位置通道的 lambda_p 对角增益，用于 slide_mode = zp_dot + lambda_p * zp。数值越大，X 轴位置误差衰减越快，但会需要更大的加速度和推力。
      type: float
      default: 1.6
      min: 0.0
      max: 5.0
      decimal: 2
    PREGME_LPY:
      description:
        short: Y 轴位置 lambda 增益
        long: Y 轴位置通道的 lambda_p 对角增益，用于 slide_mode = zp_dot + lambda_p * zp。数值越大，横向位置误差收敛越快，但设置过于激进时可能加剧振荡。
      type: float
      default: 2.2
      min: 0.0
      max: 5.0
      decimal: 2
    PREGME_LPZ:
      description:
        short: Z 轴位置 lambda 增益
        long: 垂向位置通道的 lambda_p 对角增益，用于塑造外环滑模面中的高度误差收敛过程。数值越大，高度修正越强，但垂向运动也会更加敏感。
      type: float
      default: 2.4
      min: 0.0
      max: 5.0
      decimal: 2
    PREGME_KPX:
      description:
        short: X 轴位置反馈增益
        long: 作用于 f_iusl 中 X 轴滑模变量的 Kp 对角增益。数值越大，水平纠偏加速度越强；设置过大可能引起姿态响应过激或推力饱和。
      type: float
      default: 1.8
      min: 0.0
      max: 5.0
      decimal: 2
    PREGME_KPY:
      description:
        short: Y 轴位置反馈增益
        long: 作用于 f_iusl 中 Y 轴滑模变量的 Kp 对角增益。数值越大，横向纠偏能力越强；应结合 PREGME_LPY 以及水平速度和推力限制共同调节。
      type: float
      default: 2.4
      min: 0.0
      max: 5.0
      decimal: 2
    PREGME_KPZ:
      description:
        short: Z 轴位置反馈增益
        long: 作用于垂向滑模变量的 Kp 对角增益，直接影响高度通道的推力需求，同时也用于生成起飞斜坡的初始值。
      type: float
      default: 1.6
      min: 0.0
      max: 5.0
      decimal: 2
    PREGME_EV1X:
      description:
        short: X 轴位置 CESO 一阶增益
        long: X 轴位置观测器的第一阶段 CESO 增益，作用于位置估计误差并参与速度估计。数值越大，跟踪越快，但也会放大位置测量噪声。
      type: float
      default: 0.01
      min: 0.0
      max: 5.0
      decimal: 2
      increment: 0.001
    PREGME_EV1Y:
      description:
        short: Y 轴位置 CESO 一阶增益
        long: Y 轴位置观测器的第一阶段 CESO 增益，作用于位置估计误差并参与速度估计。位置测量噪声较大时应谨慎增大。
      type: float
      default: 0.01
      min: 0.0
      max: 5.0
      decimal: 2
      increment: 0.001
    PREGME_EV1Z:
      description:
        short: Z 轴位置 CESO 一阶增益
        long: Z 轴位置观测器的第一阶段 CESO 增益，影响高度相关的速度估计。数值过大可能使垂向扰动估计通道的噪声增大。
      type: float
      default: 0.01
      min: 0.0
      max: 5.0
      decimal: 2
      increment: 0.001
    PREGME_EV2X:
      description:
        short: X 轴位置 CESO 二阶增益
        long: X 轴通道的第二阶段 CESO 增益，作用于速度估计误差并生成扰动估计 delta_est。数值越大，抗扰能力越强，但也可能引入更多噪声。
      type: float
      default: 0.008
      min: 0.0
      max: 5.0
      decimal: 2
      increment: 0.001
    PREGME_EV2Y:
      description:
        short: Y 轴位置 CESO 二阶增益
        long: Y 轴通道的第二阶段 CESO 增益，用于塑造横向扰动估计。应与 EV1Y 配合调节，避免引起横向加速度抖振。
      type: float
      default: 0.01
      min: 0.0
      max: 5.0
      decimal: 2
      increment: 0.001
    PREGME_EV2Z:
      description:
        short: Z 轴位置 CESO 二阶增益
        long: 垂向通道的第二阶段 CESO 增益。原始 Z 轴扰动估计在进入推力补偿前还会经过限幅、低通滤波和死区处理，以避免推力周期性波动。
      type: float
      default: 0.01
      min: 0.0
      max: 5.0
      decimal: 2
      increment: 0.001
    PREGME_EVEPS:
      description:
        short: 位置 CESO epsilon
        long: CESO 缩放参数。观测器修正项会除以 epsilon，因此数值越小，观测器响应越快、作用越强。实现中对接近 0 的数值进行了保护，但设置过小仍可能放大噪声。
      type: float
      default: 1.0
      min: 0.0
      max: 10.0
      decimal: 2
    PREGME_EVC1:
      description:
        short: 位置 CESO 非线性系数 c1
        long: 非线性 CESO 函数分母中的形状系数。c1 越大，大误差条件下的等效观测增益越低，修正响应越柔和。
      type: float
      default: 0.3
      min: 0.0
      max: 5.0
      decimal: 2
      increment: 0.01
    PREGME_EVC2:
      description:
        short: 位置 CESO 非线性系数 c2
        long: 非线性 CESO 函数分母中的偏置系数。c2 越大，小信号条件下的观测增益越低，可使扰动估计更平滑，但响应也会变慢。
      type: float
      default: 0.5
      min: 0.0
      max: 5.0
      decimal: 2
      increment: 0.01
    PREGME_PSL:
      description:
        short: 预设性能轨迹衰减率
        long: 预设性能轨迹的 l 参数，用于控制位置设定值变化后生成误差包络的衰减速度。数值越大，瞬态目标变化越快。
      type: float
      default: 1.0
      min: 0.0
      max: 20.0
      decimal: 2
    PREGME_PSW:
      description:
        short: 预设性能轨迹误差权重
        long: 预设性能轨迹的 w 参数，用于缩放构建瞬态误差轨迹 ed、ed_dot 和 ed_ddot 时采用的初始位置误差与速度误差。
      type: float
      default: 0.1
      min: 0.0
      max: 1.0
      decimal: 2
    PREGME_PSEPS:
      description:
        short: 预设轨迹刷新阈值
        long: 用于检测位置设定值是否发生显著变化并刷新预设轨迹的阈值，同时会加入内部 c 系数，以避免出现奇异行为。
      type: float
      default: 0.05
      min: 0.0
      max: 1.0
      decimal: 2
    PREGME_PSK:
      description:
        short: 预设轨迹补偿增益
        long: 预设轨迹补偿的耦合增益。控制器使用 zp = pos_err - k * ed 和 zp_dot = vel_err - k * ed_dot；当 k = 0 时，大部分预设瞬态补偿将被关闭。
      type: float
      default: 0.0
      min: 0.0
      max: 1.0
      decimal: 2
    PREGME_THRMIN:
      description:
        short: 位置控制最小推力
        long: 飞行器被判定为处于飞行状态后采用的推力下限。在起飞前，或处于地面接触且没有起飞请求时，控制器允许推力降为 0，以确保安全。
      type: float
      default: 0.4
      min: 0.0
      max: 0.95
      decimal: 2
      increment: 0.01
    PREGME_THRHOV:
      description:
        short: 固定悬停推力
        long: 维持悬停所需的名义归一化推力。在起飞前，以及悬停推力估计被禁用或尚未初始化时，控制器使用该固定悬停推力作为缩放基准。
      type: float
      default: 0.5
      min: 0.1
      max: 0.8
      decimal: 2
      increment: 0.01
    PREGME_UHTE:
      description:
        short: 启用悬停推力估计
        long: 仅在飞行器已经处于飞行状态，且未着陆、未与地面接触时启用 hover_thrust_estimate。起飞前控制器会固定使用 PREGME_THRHOV，以保证起飞过程具有确定性。
      type: boolean
      default: true
    PREGME_THRMAX:
      description:
        short: 位置控制最大推力
        long: 位置控制器使用的归一化推力上限。该参数既限制垂向推力，也会限制剩余可用的水平推力矢量。
      type: float
      default: 0.95
      min: 0.0
      max: 0.95
      decimal: 2
      increment: 0.01
    PREGME_ZVUP:
      description:
        short: 最大上升速度
        long: 垂向设定值和起飞斜坡输出使用的最大上升速度限制。起飞爬升速度不能超过该值。
      type: float
      default: 1.0
      unit: m/s
      min: 0.5
      max: 8.0
      decimal: 1
    PREGME_ZVDN:
      description:
        short: 最大下降速度
        long: 垂向设定值、着陆过程和故障保护下降逻辑使用的最大下降速度限制。
      type: float
      default: 0.75
      unit: m/s
      min: 0.5
      max: 4.0
      decimal: 1
    PREGME_XYCRS:
      description:
        short: 自主水平巡航速度
        long: 用于自主飞行类调参的水平巡航速度参数，其数值不得超过 PREGME_XYVMAX。当前模块主要保留该参数以兼容 PX4 风格的参数体系。
      type: float
      default: 10.0
      unit: m/s
      min: 2.0
      max: 20.0
      increment: 0.1
      decimal: 2
    PREGME_VMAN:
      description:
        short: 手动水平速度限制
        long: 手动模式的水平速度限制参数，其数值不得超过 PREGME_XYVMAX。在当前模块中，该参数主要受水平速度一键设置和全局响应性逻辑影响。
      type: float
      default: 10.0
      unit: m/s
      min: 2.0
      max: 20.0
      increment: 0.1
      decimal: 2
    PREGME_XYVMAX:
      description:
        short: 最大水平速度
        long: 位置控制器内环使用的总体水平速度上限，X、Y 轴速度设定值均会被限制在该数值的正负范围内。
      type: float
      default: 20.0
      unit: m/s
      min: 2.0
      max: 20.0
      increment: 0.1
      decimal: 2
    PREGME_TILTAIR:
      description:
        short: 飞行中最大倾角
        long: 飞行状态下的最大倾角限制，单位为度。该限制通过带变化率约束的倾角限制器应用，并且不会超过内部 MAX_SAFE_TILT_DEG 安全上限。
      type: float
      default: 45.0
      unit: deg
      min: 20.0
      max: 89.0
      decimal: 1
    PREGME_TILTLND:
      description:
        short: 起降阶段最大倾角
        long: 起飞状态进入 flight 之前以及着陆相关状态下使用的倾角限制，其数值不得超过 PREGME_TILTAIR。
      type: float
      default: 12.0
      unit: deg
      min: 10.0
      max: 89.0
      decimal: 1
    PREGME_LANDSPD:
      description:
        short: 着陆下降速度
        long: 着陆和故障保护下降采用的名义下降速度。参数更新时，该值会被限制为不超过 PREGME_ZVDN，也可以由 PREGME_ZVALL 自动设置。
      type: float
      default: 0.5
      unit: m/s
      min: 0.4
      decimal: 1
    PREGME_TKOSPD:
      description:
        short: 起飞爬升速度
        long: 起飞过程中请求的名义爬升速度。该值受 PREGME_ZVUP 限制，并传入起飞斜坡，使向上速度限制平滑增加。
      type: float
      default: 0.6
      unit: m/s
      min: 0.6
      max: 5.0
      decimal: 2
    PREGME_MYMAX:
      description:
        short: 手动最大偏航角速度
        long: 用于兼容 PX4 风格响应性调节的手动最大偏航角速度参数。当前位置控制模块的 PosControl 内环不会直接使用该参数，但 PREGME_VRESP 可以自动更新它。
      type: float
      default: 150.0
      unit: deg/s
      min: 0.0
      max: 400
      decimal: 1
    PREGME_MYTAU:
      description:
        short: 手动偏航输入滤波时间常数
        long: 用于兼容 PX4 风格调参的手动偏航角速度输入滤波时间常数。随着 PREGME_VRESP 增大，该参数可被逐渐调整至接近 0，使响应更加直接。
      type: float
      default: 0.08
      unit: s
      min: 0.0
      max: 5.0
      decimal: 2
    PREGME_VELD_LP:
      description:
        short: 速度微分低通截止频率
        long: 对局部速度进行数值微分以估计加速度时使用的低通滤波截止频率。设置为 0 或负值时关闭滤波；数值越大，延迟越小，但加速度估计噪声也越大。
      type: float
      default: 5.0
      unit: Hz
      min: 0.0
      max: 15.0
      decimal: 2
    PREGME_AHMAX:
      description:
        short: 最大水平加速度
        long: 用于兼容水平运动的加速度限制参数，可由 PREGME_VRESP 自动更新。当前 PosControl 内环实现不会直接将其作为硬加速度限幅。
      type: float
      default: 5.0
      unit: m/s^2
      min: 2.0
      max: 15.0
      increment: 1
      decimal: 2
    PREGME_AHOR:
      description:
        short: 名义水平加速度
        long: 用于自动或手动运动整形的兼容加速度参数，可由 PREGME_VRESP 自动更新。在将其视为直接内环限制之前，应确认上游轨迹生成器的实际使用路径。
      type: float
      default: 3.0
      unit: m/s^2
      min: 2.0
      max: 15.0
      increment: 1
      decimal: 2
    PREGME_AUPMAX:
      description:
        short: 最大上升加速度
        long: 用于兼容垂向上升运动的加速度限制参数，可由 PREGME_VRESP 自动更新。当前模块主要通过速度、推力和起飞斜坡约束垂向运动。
      type: float
      default: 4.0
      unit: m/s^2
      min: 2.0
      max: 15.0
      increment: 1
      decimal: 2
    PREGME_ADNMAX:
      description:
        short: 最大下降加速度
        long: 用于兼容垂向下降运动的加速度限制参数，可由 PREGME_VRESP 自动更新。当前控制器主要通过下降速度和推力限制保证垂向安全。
      type: float
      default: 3.0
      unit: m/s^2
      min: 2.0
      max: 15.0
      increment: 1
      decimal: 2
    PREGME_JMAX:
      description:
        short: 最大 jerk 限制
        long: 用于运动平滑的兼容 jerk 限制参数。在 PX4 风格的轨迹生成中，较小的数值通常意味着指令运动更加平滑；当前模块主要通过 PREGME_VRESP 更新该参数。
      type: float
      default: 8.0
      unit: m/s^3
      min: 0.5
      max: 500.0
      increment: 1
      decimal: 2
    PREGME_JAUTO:
      description:
        short: 自动模式 jerk 限制
        long: 用于自主运动的兼容 jerk 限制参数，可由 PREGME_VRESP 自动更新。该参数主要用于 PX4 风格的轨迹调节，而不直接参与 PosControl 反馈计算。
      type: float
      default: 4.0
      unit: m/s^3
      min: 1.0
      max: 80.0
      increment: 1
      decimal: 1
    PREGME_TKORAMP:
      description:
        short: 起飞斜坡时间
        long: 起飞状态机将向上速度限制从 0 平滑提升至请求起飞速度所需的时间。数值越大，起飞越柔和；设置为 0 时基本取消斜坡过程。
      type: float
      default: 3.0
      min: 0
      max: 5
    PREGME_SPUPTIME:
      description:
        short: 电机预旋等待时间
        long: 解锁后，起飞状态机从 spoolup 转换到 ready_for_takeoff 前的等待时间，用于防止电机尚未完成预旋时立即执行起飞指令。
      type: float
      default: 1.0
      unit: s
      min: 0
      max: 10
    PREGME_VRESP:
      description:
        short: 全局响应性预设
        long: 全局调参快捷参数。设置为非负值时，控制器会使用其平方自动改写多项加速度、jerk、偏航和倾角参数；设置为 -1 时，可分别独立调节这些参数。
      type: float
      default: -1.0
      min: -1.0
      max: 1.0
      decimal: 2
      increment: 0.05
    PREGME_XYVALL:
      description:
        short: 水平速度一键设置
        long: 一次性辅助参数。设置为非负值后，会将该值一次性复制到 PREGME_VMAN、PREGME_XYCRS 和 PREGME_XYVMAX，随后控制器会将本参数重置为 -1。
      type: float
      default: -1.0
      unit: m/s
      min: -1.0
      max: 20.0
      decimal: 1
      increment: 0.1
    PREGME_ZVALL:
      description:
        short: 垂向速度一键设置
        long: 一次性辅助参数。设置为非负值后，会据此一次性派生设置 PREGME_ZVUP、PREGME_ZVDN、PREGME_TKOSPD 和 PREGME_LANDSPD，随后控制器会将本参数重置为 -1。
      type: float
      default: -1.0
      unit: m/s
      min: -1.0
      max: 10.0
      decimal: 1
      increment: 0.1
    PREGME_COMCP_EN:
      description:
        short: 启用质心耦合补偿
        long: 启用机械臂质心（CoM）耦合补偿。启用后，位置控制器会根据机械臂质心偏移计算向心加速度补偿，并将其叠加到 ESO 扰动估计中；关闭后不执行机械臂耦合补偿。
      type: boolean
      default: true
