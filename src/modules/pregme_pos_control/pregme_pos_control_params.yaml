module_name: pregme_pos_control
parameters:
- group: Pregme Position Control
  definitions:
    PREGME_LPX:
      description:
        short: Position control lambda_x
      type: float
      default: 1.6
      min: 0.0
      max: 20.0
      decimal: 2
    PREGME_LPY:
      description:
        short: Position control lambda_y
      type: float
      default: 1.6
      min: 0.0
      max: 20.0
      decimal: 2
    PREGME_LPZ:
      description:
        short: Position control lambda_z
      type: float
      default: 3.0
      min: 0.0
      max: 20.0
      decimal: 2
    PREGME_KPX:
      description:
        short: Position control K_x
      type: float
      default: 1.6
      min: 0.0
      max: 20.0
      decimal: 2
    PREGME_KPY:
      description:
        short: Position control K_y
      type: float
      default: 1.6
      min: 0.0
      max: 20.0
      decimal: 2
    PREGME_KPZ:
      description:
        short: Position control K_z
      type: float
      default: 1.3
      min: 0.0
      max: 20.0
      decimal: 2
    PREGME_EV1X:
      description:
        short: ESO velocity L1_x
      type: float
      default: 0.009999999776482582
      min: 0.0
      max: 10.0
      decimal: 2
    PREGME_EV1Y:
      description:
        short: ESO velocity L1_y
      type: float
      default: 0.009999999776482582
      min: 0.0
      max: 10.0
      decimal: 2
    PREGME_EV1Z:
      description:
        short: ESO velocity L1_z
      type: float
      default: 0.009999999776482582
      min: 0.0
      max: 10.0
      decimal: 2
    PREGME_EV2X:
      description:
        short: ESO velocity L2_x
      type: float
      default: 0.00800000037997961
      min: 0.0
      max: 40.0
      decimal: 2
    PREGME_EV2Y:
      description:
        short: ESO velocity L2_y
      type: float
      default: 0.009999999776482582
      min: 0.0
      max: 40.0
      decimal: 2
    PREGME_EV2Z:
      description:
        short: ESO velocity L2_z
      type: float
      default: 0.009999999776482582
      min: 0.0
      max: 40.0
      decimal: 2
    PREGME_EVEPS:
      description:
        short: ESO velocity epsilon
      type: float
      default: 1.0
      min: 0.0
      max: 40.0
      decimal: 2
    PREGME_EVC1:
      description:
        short: ESO velocity c1
      type: float
      default: 0.30000001192092896
      min: 0.0
      max: 40.0
      decimal: 2
    PREGME_EVC2:
      description:
        short: ESO velocity c2
      type: float
      default: 0.5
      min: 0.0
      max: 40.0
      decimal: 2
    PREGME_PSL:
      description:
        short: Preset trajectory l parameter
      type: float
      default: 1.0
      min: 0.0
      max: 20.0
      decimal: 2
    PREGME_PSW:
      description:
        short: Preset trajectory w parameter
      type: float
      default: 0.10000000149011612
      min: 0.0
      max: 1.0
      decimal: 2
    PREGME_PSEPS:
      description:
        short: Preset trajectory epsilon
      type: float
      default: 0.05000000074505806
      min: 0.0
      max: 1.0
      decimal: 2
    PREGME_PSK:
      description:
        short: Preset trajectory k parameter
      type: float
      default: 1.0
      min: 0.0
      max: 1.0
      decimal: 2
    PREGME_THRMIN:
      description:
        short: Minimum thrust in auto thrust control
        long: It's recommended to set it > 0 to avoid free fall with zero thrust.
      type: float
      default: 0.11999999731779099
      min: 0.05
      max: 1.0
      decimal: 2
      increment: 0.01
    PREGME_THRHOV:
      description:
        short: Hover thrust
        long: Vertical thrust required to hover. Mapped to center stick for manual
          throttle control.
      type: float
      default: 0.6499999761581421
      min: 0.1
      max: 0.8
      decimal: 2
      increment: 0.01
    PREGME_UHTE:
      description:
        short: Use hover thrust estimator
        long: Set false to use fixed parameter PREGME_THRHOV, true to use computed
          value
      type: boolean
      default: true
    PREGME_THRMAX:
      description:
        short: Maximum thrust in auto thrust control
      type: float
      default: 1.0
      min: 0.0
      max: 2.0
      decimal: 2
      increment: 0.01
    PREGME_ZVUP:
      description:
        short: Maximum vertical ascent velocity
        long: Maximum vertical velocity in AUTO mode and endpoint for stabilized modes
      type: float
      default: 1.0
      unit: m/s
      min: 0.5
      max: 8.0
      decimal: 1
    PREGME_ZVDN:
      description:
        short: Maximum vertical descent velocity
      type: float
      default: 0.75
      unit: m/s
      min: 0.5
      max: 4.0
      decimal: 1
    PREGME_XYCRS:
      description:
        short: Maximum horizontal velocity in mission
        long: Horizontal velocity used when flying autonomously in missions, RTL,
          Goto. Must not exceed PREGME_XYVMAX.
      type: float
      default: 10.0
      unit: m/s
      min: 2.0
      max: 20.0
      increment: 0.1
      decimal: 2
    PREGME_VMAN:
      description:
        short: Maximum horizontal velocity for manual controlled mode
        long: Manual horizontal velocity limit. Must not exceed PREGME_XYVMAX.
      type: float
      default: 10.0
      unit: m/s
      min: 2.0
      max: 20.0
      increment: 0.1
      decimal: 2
    PREGME_XYVMAX:
      description:
        short: Maximum horizontal velocity
        long: Overall safety upper bound for horizontal velocity setpoints.
      type: float
      default: 20.0
      unit: m/s
      min: 2.0
      max: 20.0
      increment: 0.1
      decimal: 2
    PREGME_TILTAIR:
      description:
        short: Maximum tilt angle in air
        long: Limits maximum tilt in AUTO and POSCTRL modes during flight
      type: float
      default: 45.0
      unit: deg
      min: 20.0
      max: 89.0
      decimal: 1
    PREGME_TILTLND:
      description:
        short: Maximum tilt during landing
      type: float
      default: 12.0
      unit: deg
      min: 10.0
      max: 89.0
      decimal: 1
    PREGME_LANDSPD:
      description:
        short: Landing descend rate
      type: float
      default: 0.5
      unit: m/s
      # min: 0.6
      min: 0.4
      decimal: 1
    PREGME_TKOSPD:
      description:
        short: Takeoff climb rate
      type: float
      default: 0.6000000238418579
      unit: m/s
      # min: 1.0
      min: 0.6
      max: 5.0
      decimal: 2
    PREGME_MYMAX:
      description:
        short: Max manual yaw rate
      type: float
      default: 150.0
      unit: deg/s
      min: 0.0
      max: 400
      decimal: 1
    PREGME_MYTAU:
      description:
        short: Manual yaw rate input filter time constant
        long: Setting this parameter to 0 disables the filter
      type: float
      default: 0.07999999821186066
      unit: s
      min: 0.0
      max: 5.0
      decimal: 2
    PREGME_VELD_LP:
      description:
        short: Low pass filter cut freq for numerical velocity derivative
      type: float
      default: 5.0
      unit: Hz
      min: 0.0
      max: 10
      decimal: 2
    PREGME_AHMAX:
      description:
        short: Maximum horizontal acceleration
      type: float
      default: 5.0
      unit: m/s^2
      min: 2.0
      max: 15.0
      increment: 1
      decimal: 2
    PREGME_AHOR:
      description:
        short: Acceleration for auto and for manual
      type: float
      default: 3.0
      unit: m/s^2
      min: 2.0
      max: 15.0
      increment: 1
      decimal: 2
    PREGME_AUPMAX:
      description:
        short: Maximum vertical acceleration upward
      type: float
      default: 4.0
      unit: m/s^2
      min: 2.0
      max: 15.0
      increment: 1
      decimal: 2
    PREGME_ADNMAX:
      description:
        short: Maximum vertical acceleration downward
      type: float
      default: 3.0
      unit: m/s^2
      min: 2.0
      max: 15.0
      increment: 1
      decimal: 2
    PREGME_JMAX:
      description:
        short: Maximum jerk limit
        long: Limit the maximum jerk of the vehicle. Lower value leads to smoother
          motion.
      type: float
      default: 8.0
      unit: m/s^3
      min: 0.5
      max: 500.0
      increment: 1
      decimal: 2
    PREGME_JAUTO:
      description:
        short: Jerk limit in auto mode
      type: float
      default: 4.0
      unit: m/s^3
      min: 1.0
      max: 80.0
      increment: 1
      decimal: 1
    PREGME_TKORAMP:
      description:
        short: Position control smooth takeoff ramp time constant
        long: Increasing makes takeoff slower. A time constant of 0 disables the ramp.
      type: float
      default: 3.0
      min: 0
      max: 5
    PREGME_SPUPTIME:
      description:
        short: Enforced delay between arming and takeoff
      type: float
      default: 1.0
      unit: s
      min: 0
      max: 10
    PREGME_VRESP:
      description:
        short: Responsiveness
        long: Changes overall responsiveness. Higher = faster reaction.
      type: float
      default: -1.0
      min: -1.0
      max: 1.0
      decimal: 2
      increment: 0.05
    PREGME_XYVALL:
      description:
        short: One-shot overall horizontal velocity setter
        long: Set to a non-negative value to copy it once into PREGME_VMAN, PREGME_XYCRS and PREGME_XYVMAX. The controller resets this parameter to -1 after applying it. Leave at -1 to tune those parameters independently.
      type: float
      default: -1.0
      unit: m/s
      min: -1.0
      max: 20.0
      decimal: 1
      increment: 0.1
    PREGME_ZVALL:
      description:
        short: One-shot overall vertical velocity setter
        long: Set to a non-negative value to derive PREGME_ZVUP, PREGME_ZVDN, PREGME_TKOSPD and PREGME_LANDSPD once. The controller resets this parameter to -1 after applying it. Leave at -1 to tune those parameters independently.
      type: float
      default: -1.0
      unit: m/s
      min: -1.0
      max: 10.0
      decimal: 1
      increment: 0.1
