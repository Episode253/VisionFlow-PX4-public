module_name: pregme_pos_control_v1
parameters:
- group: Pregme Position Control V1
  definitions:
    USR_MASS_UAV:
      description:
        short: Mass of UAV
      type: float
      default: 5.0
      min: 0.0
      max: 40.0
      decimal: 2
    USR_MASS_MANIP:
      description:
        short: Mass of manipulator
      type: float
      default: 2.3
      min: 0.0
      max: 40.0
      decimal: 2
    USR_LAMBDA_P_X:
      description:
        short: Position control lambda_x
      type: float
      default: 2.0
      min: 0.0
      max: 20.0
      decimal: 2
    USR_LAMBDA_P_Y:
      description:
        short: Position control lambda_y
      type: float
      default: 2.0
      min: 0.0
      max: 20.0
      decimal: 2
    USR_LAMBDA_P_Z:
      description:
        short: Position control lambda_z
      type: float
      default: 2.0
      min: 0.0
      max: 20.0
      decimal: 2
    USR_K_P_X:
      description:
        short: Position control K_x
      type: float
      default: 2.0
      min: 0.0
      max: 20.0
      decimal: 2
    USR_K_P_Y:
      description:
        short: Position control K_y
      type: float
      default: 2.0
      min: 0.0
      max: 20.0
      decimal: 2
    USR_K_P_Z:
      description:
        short: Position control K_z
      type: float
      default: 1.0
      min: 0.0
      max: 20.0
      decimal: 2
    USR_ESO_V_L1_X:
      description:
        short: ESO velocity L1_x
      type: float
      default: 0.0
      min: 0.0
      max: 10.0
      decimal: 2
    USR_ESO_V_L1_Y:
      description:
        short: ESO velocity L1_y
      type: float
      default: 0.0
      min: 0.0
      max: 10.0
      decimal: 2
    USR_ESO_V_L1_Z:
      description:
        short: ESO velocity L1_z
      type: float
      default: 0.0
      min: 0.0
      max: 10.0
      decimal: 2
    USR_ESO_V_L2_X:
      description:
        short: ESO velocity L2_x
      type: float
      default: 0.0
      min: 0.0
      max: 40.0
      decimal: 2
    USR_ESO_V_L2_Y:
      description:
        short: ESO velocity L2_y
      type: float
      default: 0.0
      min: 0.0
      max: 40.0
      decimal: 2
    USR_ESO_V_L2_Z:
      description:
        short: ESO velocity L2_z
      type: float
      default: 0.0
      min: 0.0
      max: 40.0
      decimal: 2
    USR_ESO_V_EPSI:
      description:
        short: ESO velocity epsilon
      type: float
      default: 1.0
      min: 0.0
      max: 40.0
      decimal: 2
    USR_ESO_V_C1:
      description:
        short: ESO velocity c1
      type: float
      default: 0.3
      min: 0.0
      max: 40.0
      decimal: 2
    USR_ESO_V_C2:
      description:
        short: ESO velocity c2
      type: float
      default: 0.5
      min: 0.0
      max: 40.0
      decimal: 2
    USR_PRESET_L:
      description:
        short: Preset trajectory l parameter
      type: float
      default: 1.0
      min: 0.0
      max: 20.0
      decimal: 2
    USR_PRESET_W:
      description:
        short: Preset trajectory w parameter
      type: float
      default: 0.1
      min: 0.0
      max: 1.0
      decimal: 2
    USR_PRESET_EPSI:
      description:
        short: Preset trajectory epsilon
      type: float
      default: 0.05
      min: 0.0
      max: 0.5
      decimal: 2
    USR_PRESET_K:
      description:
        short: Preset trajectory k parameter
      type: float
      default: 1.0
      min: 0.0
      max: 1.0
      decimal: 2
    USR_THR_MIN:
      description:
        short: Minimum thrust in auto thrust control
        long: It's recommended to set it > 0 to avoid free fall with zero thrust.
      type: float
      default: 0.12
      min: 0.05
      max: 1.0
      decimal: 2
      increment: 0.01
    USR_THR_HOVER:
      description:
        short: Hover thrust
        long: Vertical thrust required to hover. Mapped to center stick for manual throttle control.
      type: float
      default: 0.65
      min: 0.1
      max: 0.8
      decimal: 2
      increment: 0.01
    USR_USE_HTE:
      description:
        short: Use hover thrust estimator
        long: Set false to use fixed parameter USR_THR_HOVER, true to use computed value
      type: boolean
      default: true
    USR_THR_CURVE:
      description:
        short: Thrust curve in Manual Mode
        long: Defines how throttle stick input is mapped to commanded thrust
      type: int32
      default: 0
      min: 0
      max: 1
    USR_THR_MAX:
      description:
        short: Maximum thrust in auto thrust control
      type: float
      default: 1.0
      min: 0.0
      max: 2.0
      decimal: 2
      increment: 0.01
    USR_MANTHR_MIN:
      description:
        short: Minimum manual thrust
        long: Minimum vertical thrust. Recommended to set > 0 to avoid free fall.
      type: float
      default: 0.08
      min: 0.0
      max: 1.0
      decimal: 2
      increment: 0.01
    USR_Z_VEL_MAX_UP:
      description:
        short: Maximum vertical ascent velocity
        long: Maximum vertical velocity in AUTO mode and endpoint for stabilized modes
      type: float
      default: 0.5
      unit: m/s
      min: 0.5
      max: 8.0
      decimal: 1
    USR_Z_VEL_MAX_DN:
      description:
        short: Maximum vertical descent velocity
      type: float
      default: 0.5
      unit: m/s
      min: 0.5
      max: 4.0
      decimal: 1
    USR_XY_CRUISE:
      description:
        short: Maximum horizontal velocity in mission
        long: Horizontal velocity used when flying autonomously in missions, RTL, Goto
      type: float
      default: 3.0
      unit: m/s
      min: 3.0
      max: 20.0
      increment: 1
      decimal: 2
    USR_XY_ERR_MAX:
      description:
        short: Maximum horizontal error allowed by trajectory generator
      type: float
      default: 2.0
      min: 0.1
      max: 10.0
      decimal: 1
    USR_VEL_MANUAL:
      description:
        short: Maximum horizontal velocity for manual controlled mode
      type: float
      default: 3.0
      unit: m/s
      min: 3.0
      max: 20.0
      increment: 1
      decimal: 2
    USR_XY_VEL_MAX:
      description:
        short: Maximum horizontal velocity
        long: Maximum horizontal velocity in AUTO mode
      type: float
      default: 1.0
      unit: m/s
      min: 0.0
      max: 20.0
      increment: 1
      decimal: 2
    USR_TILTMAX_AIR:
      description:
        short: Maximum tilt angle in air
        long: Limits maximum tilt in AUTO and POSCTRL modes during flight
      type: float
      default: 45.0
      unit: deg
      min: 20.0
      max: 89.0
      decimal: 1
    USR_TILTMAX_LND:
      description:
        short: Maximum tilt during landing
      type: float
      default: 12.0
      unit: deg
      min: 10.0
      max: 89.0
      decimal: 1
    USR_LAND_SPEED:
      description:
        short: Landing descend rate
      type: float
      default: 0.7
      unit: m/s
      min: 0.6
      decimal: 1
    USR_LAND_RC_HELP:
      description:
        short: Enable user assisted descent speed for autonomous land routine
      type: int32
      default: 0
      min: 0
      max: 1
    USR_TKO_SPEED:
      description:
        short: Takeoff climb rate
      type: float
      default: 1.5
      unit: m/s
      min: 1.0
      max: 5.0
      decimal: 2
    USR_MAN_TILT_MAX:
      description:
        short: Maximal tilt angle in manual or altitude mode
      type: float
      default: 35.0
      unit: deg
      min: 0.0
      max: 90.0
      decimal: 1
    USR_MAN_Y_MAX:
      description:
        short: Max manual yaw rate
      type: float
      default: 150.0
      unit: deg/s
      min: 0.0
      max: 400
      decimal: 1
    USR_MAN_Y_TAU:
      description:
        short: Manual yaw rate input filter time constant
        long: Setting this parameter to 0 disables the filter
      type: float
      default: 0.08
      unit: s
      min: 0.0
      max: 5.0
      decimal: 2
    USR_HOLD_DZ:
      description:
        short: Deadzone of sticks where position hold is enabled
      type: float
      default: 0.1
      min: 0.0
      max: 1.0
      decimal: 2
    USR_HOLD_MAX_XY:
      description:
        short: Maximum horizontal velocity for position hold
      type: float
      default: 0.8
      unit: m/s
      min: 0.0
      max: 3.0
      decimal: 2
    USR_HOLD_MAX_Z:
      description:
        short: Maximum vertical velocity for position hold
      type: float
      default: 0.6
      unit: m/s
      min: 0.0
      max: 3.0
      decimal: 2
    USR_VELD_LP:
      description:
        short: Low pass filter cut freq for numerical velocity derivative
      type: float
      default: 5.0
      unit: Hz
      min: 0.0
      max: 10
      decimal: 2
    USR_ACC_HOR_MAX:
      description:
        short: Maximum horizontal acceleration
      type: float
      default: 5.0
      unit: m/s^2
      min: 2.0
      max: 15.0
      increment: 1
      decimal: 2
    USR_ACC_HOR:
      description:
        short: Acceleration for auto and for manual
      type: float
      default: 3.0
      unit: m/s^2
      min: 2.0
      max: 15.0
      increment: 1
      decimal: 2
    USR_ACC_UP_MAX:
      description:
        short: Maximum vertical acceleration upward
      type: float
      default: 4.0
      unit: m/s^2
      min: 2.0
      max: 15.0
      increment: 1
      decimal: 2
    USR_ACC_DOWN_MAX:
      description:
        short: Maximum vertical acceleration downward
      type: float
      default: 3.0
      unit: m/s^2
      min: 2.0
      max: 15.0
      increment: 1
      decimal: 2
    USR_JERK_MAX:
      description:
        short: Maximum jerk limit
        long: Limit the maximum jerk of the vehicle. Lower value leads to smoother motion.
      type: float
      default: 8.0
      unit: m/s^3
      min: 0.5
      max: 500.0
      increment: 1
      decimal: 2
    USR_JERK_AUTO:
      description:
        short: Jerk limit in auto mode
      type: float
      default: 4.0
      unit: m/s^3
      min: 1.0
      max: 80.0
      increment: 1
      decimal: 1
    USR_ALT_MODE:
      description:
        short: Altitude control mode
        long: |
          0: Altitude following
          1: Terrain following
          2: Terrain hold when stationary, altitude when moving
      type: int32
      default: 0
      min: 0
      max: 2
    USR_XY_MAN_EXPO:
      description:
        short: Manual position control stick exponential curve sensitivity
      type: float
      default: 0.6
      min: 0
      max: 1
      decimal: 2
    USR_Z_MAN_EXPO:
      description:
        short: Manual control stick vertical exponential curve
      type: float
      default: 0.6
      min: 0
      max: 1
      decimal: 2
    USR_YAW_EXPO:
      description:
        short: Manual control stick yaw rotation exponential curve
      type: float
      default: 0.6
      min: 0
      max: 1
      decimal: 2
    USR_YAWRAUTO_MAX:
      description:
        short: Max yaw rate in auto mode
      type: float
      default: 45.0
      unit: deg/s
      min: 0.0
      max: 360.0
      decimal: 1
      increment: 5
    USR_LAND_ALT1:
      description:
        short: Altitude for 1st step of slow landing (descend)
      type: float
      default: 10.0
      unit: m
      min: 0
      max: 122
      decimal: 1
    USR_LAND_ALT2:
      description:
        short: Altitude for 2nd step of slow landing (landing)
      type: float
      default: 5.0
      unit: m
      min: 0
      max: 122
      decimal: 1
    USR_TKO_RAMP_T:
      description:
        short: Position control smooth takeoff ramp time constant
        long: Increasing makes takeoff slower. A time constant of 0 disables the ramp.
      type: float
      default: 3.0
      min: 0
      max: 5
    USR_POS_MODE:
      description:
        short: Manual-Position control sub-mode
        long: |
          0: Simple position control
          3: Smooth position control (Jerk optimized)
          4: Acceleration based input
      type: int32
      default: 4
      min: 0
      max: 4
    USR_SPOOLUP_TIME:
      description:
        short: Enforced delay between arming and takeoff
      type: float
      default: 1.0
      unit: s
      min: 0
      max: 10
    USR_YAW_MODE:
      description:
        short: Yaw mode in Auto
        long: |
          0: towards waypoint
          1: towards home
          2: away from home
          3: along trajectory
          4: towards waypoint (yaw first)
      type: int32
      default: 0
      min: 0
      max: 4
    USR_VEHICLE_RESP:
      description:
        short: Responsiveness
        long: Changes overall responsiveness. Higher = faster reaction.
      type: float
      default: -0.4
      min: -1.0
      max: 1.0
      decimal: 2
      increment: 0.05
    USR_XY_VEL_ALL:
      description:
        short: Overall Horizontal Velocity Limit
      type: float
      default: 1.0
      unit: m/s
      min: -20
      max: 20
      decimal: 1
      increment: 1
    USR_Z_VEL_ALL:
      description:
        short: Overall Vertical Velocity Limit
      type: float
      default: 1.0
      unit: m/s
      min: -3
      max: 8
      decimal: 1
      increment: 0.5
